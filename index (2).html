<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tamagotchi</title>
<style>
body{ margin:0; height:100vh; display:grid; place-items:center; background:#eef0f6; overflow:hidden; }

/* Semua gambar berukuran sama (1109x1418) dan ditumpuk di kanvas yang sama,
   jadi posisinya otomatis pas. Kanvas lalu diperkecil/dipotong ke area telur. */
#kotak{ position:relative; overflow:hidden; }
#stage{ position:absolute; width:1109px; height:1418px; transform-origin:0 0; }
.layer{ position:absolute; left:0; top:0; width:1109px; height:1418px; user-select:none; -webkit-user-drag:none; }

#sorot{ position:absolute; width:64px; height:60px; box-sizing:border-box;
  border:3px solid #6c4bd6; border-radius:10px; pointer-events:none; }
.hati{ position:absolute; width:25px; height:21px; background-repeat:no-repeat; background-size:1109px 1418px; }

/* ANIMASI karakter (steps = gerak patah-patah ala pixel art) */
@keyframes goyang { 0%{transform:translateY(0)}   50%{transform:translateY(-6px)} }
@keyframes loncat { 0%{transform:translateY(0)}   50%{transform:translateY(-22px)} }
@keyframes getar  { 0%{transform:translateX(-4px)} 50%{transform:translateX(4px)} }
@keyframes napas  { 0%{transform:translateY(0)}   50%{transform:translateY(4px)} }
@keyframes kunyah { 0%{transform:translateY(0)}   50%{transform:translateY(-4px)} }
.pose-normal    { animation: goyang .9s  steps(1) infinite; }
.pose-happy     { animation: loncat .5s  steps(1) infinite; }
.pose-main      { animation: loncat .4s  steps(1) infinite; }
.pose-makan     { animation: kunyah .3s  steps(1) infinite; }
.pose-sakit     { animation: getar  .16s steps(1) infinite; }
.pose-ngambek   { animation: getar  .35s steps(1) infinite; }
.pose-ceramah   { animation: getar  .25s steps(1) infinite; }
.pose-perhatian { animation: loncat .7s  steps(1) infinite; }
.pose-poop      { animation: goyang 1.1s steps(1) infinite; }
.pose-mandi     { animation: goyang .5s  steps(1) infinite; }
.pose-tidur     { animation: napas  1.4s steps(1) infinite; }

#suara{ position:fixed; right:12px; bottom:12px; width:44px; height:44px; border:0; border-radius:50%;
  background:#fff; font-size:20px; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.15); }
/* EFEK: makanan jatuh & gelembung (area tengah layar, di antara dua baris ikon) */
#efek{ position:absolute; left:413px; top:606px; width:313px; height:171px; overflow:hidden; pointer-events:none; }
@keyframes jatuh { 0%{transform:translateY(-50px);opacity:1} 80%{transform:translateY(70px);opacity:1} 100%{transform:translateY(70px);opacity:0} }
.makanan{ position:absolute; top:0; width:40px; height:40px; animation: jatuh .9s steps(8) both; }
@keyframes naik { 0%{transform:translate(0,0);opacity:0} 10%{opacity:1} 100%{transform:translate(var(--dx),-150px);opacity:0} }
.gelembung{ position:absolute; bottom:0; box-sizing:border-box; border:3px solid #5aa9e6;
  background:rgba(255,255,255,.55); border-radius:50%; animation: naik 1.6s steps(12) both; }
/* suntik: jarum menusuk, lalu tanda + naik; poop = layer terpisah */
@keyframes tusuk { 0%{transform:translateX(60px)} 35%{transform:translateX(0)} 65%{transform:translateX(0)} 100%{transform:translateX(60px)} }
.jarum{ position:absolute; left:196px; top:78px; width:80px; height:32px; animation: tusuk 1.6s steps(8) both; }
@keyframes naikPlus { 0%{transform:translateY(0);opacity:0} 15%{opacity:1} 100%{transform:translateY(-70px);opacity:0} }
.plus{ position:absolute; width:20px; height:20px; animation: naikPlus 1.4s steps(8) both; }
.pose-suntik{ animation: getar .16s steps(1) infinite; }
.pose-sembuh{ animation: goyang .6s steps(1) infinite; }
.poop{ position:absolute; left:0; top:0; width:1109px; height:1418px; pointer-events:none; }
.poop img{ image-rendering:pixelated; }
/* layar menggelap saat tidur */
#gelap{ position:absolute; left:413px; top:544px; width:313px; height:296px; background:rgba(10,15,45,.62);
  opacity:0; transition:opacity 1.2s; pointer-events:none; }
#gelap.aktif{ opacity:1; }
#galat{ display:none; position:fixed; left:8px; bottom:8px; right:64px; padding:6px 10px;
  background:#fff3f3; color:#b3261e; font:12px/1.4 sans-serif; border-radius:8px; }
/* sprite & hati itu pixel art: jaga tepinya tetap tajam saat diperbesar/diperkecil */
/* gambar HD diperkecil ke ukuran game -> pakai smoothing biasa (bukan pixelated) supaya tidak bergerigi */
#karakter{ position:absolute; left:0; top:0; width:1109px; height:1418px; }
#kimg{ position:absolute; left:0; top:0; width:1109px; height:1418px; transform-origin:0 0;
  image-rendering:auto; user-select:none; -webkit-user-drag:none; }
.hati{ image-rendering:auto; }
#timbangan, #ikon{ transform-origin:0 0; image-rendering:auto; }
.zona{ position:absolute; width:64px; height:60px; padding:0; border:0; background:transparent; cursor:pointer; }
.tb{ position:absolute; width:60px; height:60px; border:0; border-radius:50%;
  background:transparent; cursor:pointer; }
.tb:active{ background:rgba(0,0,0,.18); }
</style>
</head>
<body>

<div id="kotak">
  <div id="stage">
    <img class="layer" src="img/cangkang.png" alt="">
    <img class="layer" src="img/swirl.png" alt="">

    <!-- tampilan utama -->
    <img id="ikon" class="layer" alt="">
    <div id="sorot"></div>
    <div id="karakter" class="layer"><img id="kimg" alt=""></div>
    <div id="poopWadah"></div>
    <div id="efek"></div>

    <!-- layar timbangan -->
    <img id="timbangan" class="layer" alt="" style="display:none">
    <div id="hatiWadah" style="display:none"></div>
    <div id="gelap"></div>

    <!-- 3 tombol di cangkang (menimpa tombol biru) -->
    <button class="tb" id="tb1" style="left:406px; top:861px" aria-label="Sebelumnya"></button>
    <button class="tb" id="tb2" style="left:536px; top:876px" aria-label="Pilih"></button>
    <button class="tb" id="tb3" style="left:663px; top:860px" aria-label="Berikutnya"></button>
  </div>
</div>

<div id="galat"></div>
<button id="suara" aria-label="Suara">🔊</button>

<script>
/* ================= PENGATURAN ================= */
const IMG = "hd/";   // folder gambar HD (kalau tidak ada, dicari otomatis di tempat lain, lihat cariGambar)
/* Pencari gambar otomatis: tiap gambar dicoba di hd/, folder yang sama dengan index.html, dan img/,
   dengan nama biasa maupun yang berakhiran _1 / kode acak (mis. icon_57b3fa.png) hasil download. */
const NAMA_LAIN = { "icon":["icon_57b3fa"], "iconbawahmerah":["iconbawahmerah_17d59d"] };
const RES = {};          // nama file -> alamat yang ketemu
let siap = false;        // true setelah pencarian selesai
const U = n => RES[n] || (IMG + n);
function kandidat(n){
  const base = n.replace(/\.png$/, "");
  const nama = [base, base + "_1", ...(NAMA_LAIN[base] || [])];
  const out = [];
  ["hd/", "", "img/"].forEach(d => nama.forEach(x => out.push(d + x + ".png")));
  return out;
}
function cobaMuat(url){ return new Promise(ok => { const i = new Image(); i.onload = () => ok(true); i.onerror = () => ok(false); i.src = url; }); }
async function cariGambar(daftar){
  await Promise.all(daftar.map(async n => {
    for (const u of kandidat(n)){ if (await cobaMuat(u)){ RES[n] = u; return; } }
  }));
}
const POSE = {
  normal:"karakterdeafult.png", mandi:"karakterdeafult.png",         happy:"karakterhappy.png",
  sakit:"karaktersakit.png",            main:"karaktermain.png",
  makan:"karaktermakan.png",            suntik:"karaktersakit.png", sembuh:"karakterdeafult.png",
  tidur:"karaktertidur.png",           ceramah:"karaktermendengarceramah.png",
  ngambek:"karakterngambek.png",        perhatian:"karakterbutuhperhatian.png"
};

/* ===== UKURAN GAMBAR HD =====
   Tiap pose digambar dengan ukuran berbeda-beda, jadi masing-masing diskalakan SATU-SATU
   supaya tinggi karakter (ujung telinga sampai kaki) di layar game sama: TINGGI px.
   b = kotak isi gambar HD [kiri, atas, kanan, bawah] (hasil ukur).
   Kalau ada pose yang masih kebesaran/kekecilan, ubah angka "t" pose itu (tinggi dalam px game),
   atau "lebar" untuk pose yang berbaring (tidur). */
const TINGGI = 124;                     // tinggi karakter di layar game (px kanvas)
const LANTAI = { x:569.5, y:762 };      // titik tengah-bawah (kaki) karakter di layar
const AREA_Y = [606, 777];              // batas atas & bawah area karakter (di antara dua baris ikon)
const PIKSEL = 4;                       // ukuran 1 piksel pixel-art poop di layar game
const SPRITE = {
  "karakterdeafult.png":            { b:[363,513,744,928]  },
  "karakterhappy.png":              { b:[194,311,906,1112] },
  "karaktermain.png":               { b:[197,354,916,1071] },
  "karaktermakan.png":              { b:[350,418,759,1008] },
  "karaktermendengarceramah.png":   { b:[234,460,831,1037] },
  "karakterngambek.png":            { b:[272,354,836,1090] },
  "karaktersakit.png":              { b:[314,427,794,993]  },
  "karaktertidur.png":              { b:[123,491,986,1093], lebar:200 },   // berbaring: diatur lewat lebar
  "karakterbutuhperhatian.png":     { b:[242,372,867,1065] }
};
// timbangan.png HD: diperkecil & digeser ke layar telur
const TIMB = { s:0.431, x:330.5, y:383.4 };
// icon HD: tiap file punya ukuran kanvas berbeda, jadi diskalakan sendiri-sendiri ke layar telur (413..726 x 544..839).
// pita = dua kotak pink [kiri, atas, kanan, bawah] (atas & bawah); bintang liar di luar pita dipotong otomatis.
const ICON_HD = {
  "icon.png":          { pita:[[98,279,1011,458],[98,962,1011,1141]] },
  "iconbawahmerah.png":{ pita:[[166,343,943,495],[166,925,943,1077]] }
};
const LAYAR = { x:413, y:544, w:313 };
function pasangIkon(berkas){
  const d = ICON_HD[berkas], el = $("ikon");
  if (!d){ el.style.transform = el.style.clipPath = "none"; return; }
  const [a, b] = d.pita, k = LAYAR.w / (a[2] - a[0]);
  el.style.transform = `translate(${LAYAR.x - a[0] * k}px, ${LAYAR.y - a[1] * k}px) scale(${k})`;
  el.style.clipPath = `polygon(${a[0]}px ${a[1]}px, ${a[2]}px ${a[1]}px, ${a[2]}px ${a[3]}px, ${a[0]}px ${a[3]}px, ` +
    `${b[0]}px ${b[1]}px, ${b[2]}px ${b[1]}px, ${b[2]}px ${b[3]}px, ${b[0]}px ${b[3]}px)`;
}

// poop.png HD: titik tengah-bawah tumpukan poop & ukuran 1 piksel-nya
const POOP_HD = { x:551.5, y:1240, P:64 };
// kotak tiap hati di gambar HD [kiri, atas, kanan, bawah]; baris: hunger, energy, health, joy
const HATI_HD = {
  "hatifull.png": [
    [[387,201,530,324],[586,201,728,324],[784,201,927,324]],
    [[387,538,529,661],[585,538,728,661],[784,538,926,661]],
    [[387,860,530,982],[586,860,728,982],[784,860,927,982]],
    [[185,1180,324,1306],[387,1180,530,1303],[586,1180,728,1303],[784,1180,927,1303]]
  ],
  "hatikosong.png": [
    [[394,177,531,295],[585,177,722,295],[777,177,913,295]],
    [[394,502,531,620],[585,502,722,620],[777,502,913,620]],
    [[394,811,531,929],[585,811,722,929],[777,811,913,929]],
    [[199,1120,332,1242],[394,1120,531,1238],[585,1120,722,1238],[777,1120,913,1238]]
  ]
};
const HATI_W = 25, HATI_H = 21;   // ukuran hati di layar game

// semua waktu dalam DETIK (ubah di sini kalau mau lebih cepat/lambat)
const D = {
  poop:75,      // satu poop baru muncul tiap 75 detik (menumpuk kalau tidak dibersihkan)
  sakit:90,     // sakit muncul tiap 90 detik
  ngambek:60,   // ngambek muncul tiap 60 detik
  jeda:20,      // jarak minimal antar kejadian (supaya tidak beruntun)
  suntik:1.6,   // lama jarum menyuntik
  sembuh:1.4,   // lama tanda + naik setelah disuntik
  lapar:30,     // hunger turun 1 hati tiap 30 detik
  joy:40,       // joy turun 1 hati tiap 40 detik
  energi:60,    // energy turun 1 hati tiap 60 detik
  main:5,       // lama pose main
  ceramah:5,    // lama pose mendengar ceramah
  makan:3,      // lama pose makan
  tidur:10,     // lama tidur setelah lampu dipencet
  mandi:3,      // lama mandi (gelembung)
  happy:3       // lama pose happy setelah menyelesaikan task
};

const MAKS = { hunger:3, energy:3, health:3, joy:4 };   // jumlah hati maksimal
const MAKS_POOP = 3;    // poop maksimal yang bisa menumpuk
const RENDAH = 1;   // kalau ada hati <= angka ini, karakter jadi "butuh perhatian"

/* ================= DATA GAME ================= */
const s = { hunger:3, energy:3, health:3, joy:4,
            sakit:false, poop:0, ngambek:false, tidur:false };
let temp = null;      // pose sementara (makan, main, happy, dst)
let sibuk = false;    // true saat animasi berjalan (aksi lain diabaikan)
let layar = "utama";  // "utama" atau "status"
let kursor = 0;       // ikon terpilih 0-7
let seq;
const $ = id => document.getElementById(id);
const naik  = (k) => s[k] = Math.min(MAKS[k], s[k] + 1);
const turun = (k) => s[k] = Math.max(0, s[k] - 1);
const kritis = () => Object.keys(MAKS).some(k => s[k] === 0);   // ada yang benar-benar habis

/* ================= POSISI (koordinat kanvas 1109x1418) ================= */
const IKON_X = [467, 532, 598, 664];     // titik tengah tiap ikon
const IKON_Y = [575, 808];               // baris atas, baris bawah
const BARIS_HATI = [
  { k:"hunger", y:641, x:[560,590,621] },
  { k:"energy", y:693, x:[560,590,621] },
  { k:"health", y:743, x:[560,590,621] },
  { k:"joy",    y:792, x:[528,560,590,621] }
];

/* ================= SUARA (dibuat otomatis, tanpa file) ================= */
// tiap nada = [frekuensi Hz, durasi detik]; 0 = hening
const SUARA = {
  klik:   [[880,.05]],
  buka:   [[660,.06],[990,.08]],
  tolak:  [[220,.12]],
  makan:  [[300,.07],[0,.04],[300,.07],[0,.04],[300,.07]],
  happy:  [[523,.09],[659,.09],[784,.09],[1047,.16]],
  main:   [[600,.06],[800,.06],[600,.06],[800,.06],[1000,.1]],
  obat:   [[700,.08],[500,.12]],
  mandi:  [[900,.05],[700,.05],[900,.05],[700,.05],[900,.08]],
  ceramah:[[260,.15],[0,.05],[260,.15],[0,.05],[200,.2]],
  tidur:  [[500,.18],[420,.18],[340,.18],[260,.3]],
  sakit:  [[400,.15],[340,.15],[280,.25]],
  alert:  [[1000,.1],[0,.06],[1000,.1]]
};
let ac = null, bisu = false, terbuka = false;
function bunyi(nama){
  if (bisu || !terbuka || !SUARA[nama]) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
    let t0 = ac.currentTime;
    SUARA[nama].forEach(([f, d]) => {
      if (f){
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = "square"; o.frequency.value = f;
        g.gain.setValueAtTime(0.07, t0);
        g.gain.exponentialRampToValueAtTime(0.001, t0 + d);
        o.connect(g); g.connect(ac.destination);
        o.start(t0); o.stop(t0 + d);
      }
      t0 += d;
    });
  } catch (e) {}
}
// browser baru boleh bunyi setelah pengguna klik/tekan sesuatu
["pointerdown","keydown"].forEach(ev => addEventListener(ev, () => terbuka = true));
$("suara").onclick = () => { bisu = !bisu; $("suara").textContent = bisu ? "🔇" : "🔊"; };

/* ================= POSE ================= */
function poseSekarang(){
  if (temp) return temp;
  if (s.tidur) return "tidur";
  if (s.sakit) return "sakit";
  if (s.ngambek) return "ngambek";
  if (Object.keys(MAKS).some(k => s[k] <= RENDAH)) return "perhatian";
  return "normal";
}

// jalankan urutan pose, mis. [["makan",3],["happy",3]]
function urut(langkah){
  clearTimeout(seq);
  sibuk = true;
  let i = 0;
  (function lanjut(){
    if (i >= langkah.length){ temp = null; sibuk = false; render(); return; }
    temp = langkah[i][0];
    if (langkah[i][2]) langkah[i][2]();           // fungsi opsional saat langkah dimulai
    if (temp === "happy") bunyi("happy");
    render();
    seq = setTimeout(lanjut, langkah[i][1] * 1000);
    i++;
  })();
}

/* ================= EFEK ================= */
// makanan digambar dari kode (pixel art 8x8), tanpa file gambar
const PAL = { k:"#1a1a1a", r:"#ff6b81", w:"#ffffff", y:"#ffd166", g:"#4caf50" };
const MAKANAN = [
  ["...kg...","..kkgk..",".kkrrkk.","krrrrrrk","krrwrrrk","krrrrrrk",".krrrrk.","..kkkk.."],   // apel
  ["...kk...","..kwwk..",".kwwwwk.","kwwwwwwk","kwkkkkwk","kwkkkkwk","kwwwwwwk",".kkkkkk."],   // onigiri
  ["..kkkk..",".kyyyyk.","kyykyyyk","kyyyyyyk","kykyyykk","kyyyyyyk",".kyyyyk.","..kkkk.."]    // kue
];
function svgPiksel(pola, px = 5){
  let isi = "";
  pola.forEach((baris, y) => [...baris].forEach((c, x) => {
    if (c !== ".") isi += `<rect x="${x}" y="${y}" width="1" height="1" fill="${PAL[c]}"/>`;
  }));
  return `<svg viewBox="0 0 ${pola[0].length} ${pola.length}" width="${pola[0].length * px}" height="${pola.length * px}" shape-rendering="crispEdges">${isi}</svg>`;
}
const PLUS = ["..g..","..g..","ggggg","..g..","..g.."];
const JARUM = `<svg viewBox="0 0 20 8" width="80" height="32" shape-rendering="crispEdges">
<rect x="0" y="3" width="5" height="2" fill="#1a1a1a"/><rect x="5" y="1" width="11" height="6" fill="#1a1a1a"/>
<rect x="6" y="2" width="9" height="4" fill="#fff"/><rect x="6" y="2" width="5" height="4" fill="#ffd166"/>
<rect x="16" y="3" width="3" height="2" fill="#1a1a1a"/><rect x="19" y="1" width="1" height="6" fill="#1a1a1a"/></svg>`;
let timerEfek;
function efek(jenis){
  const w = $("efek");
  clearTimeout(timerEfek);
  w.innerHTML = "";
  if (jenis === "makan"){                       // 3 makanan jatuh dari atas ke mulut karakter
    MAKANAN.forEach((pola, i) => {
      const d = document.createElement("div");
      d.className = "makanan";
      d.innerHTML = svgPiksel(pola);
      d.style.left = (112 + Math.random() * 40) + "px";
      d.style.animationDelay = (i * 0.9) + "s";
      w.appendChild(d);
    });
  }
  if (jenis === "suntik"){                      // jarum menusuk, lalu tanda + naik
    const j = document.createElement("div");
    j.className = "jarum"; j.innerHTML = JARUM;
    j.style.animationDuration = D.suntik + "s";
    w.appendChild(j);
    for (let i = 0; i < 4; i++){
      const pl = document.createElement("div");
      pl.className = "plus"; pl.innerHTML = svgPiksel(PLUS, 4);
      pl.style.left = (110 + Math.random() * 90) + "px";
      pl.style.top  = (70 + Math.random() * 50) + "px";
      pl.style.animationDelay = (D.suntik + i * 0.3) + "s";
      w.appendChild(pl);
    }
  }
  if (jenis === "mandi"){                       // gelembung naik dari bawah
    for (let i = 0; i < 14; i++){
      const g = document.createElement("div");
      const ukuran = 14 + Math.random() * 18;
      g.className = "gelembung";
      g.style.width = g.style.height = ukuran + "px";
      g.style.left = (70 + Math.random() * 170) + "px";
      g.style.setProperty("--dx", (Math.random() * 30 - 15) + "px");
      g.style.animationDelay = (Math.random() * 1.2) + "s";
      w.appendChild(g);
    }
  }
  timerEfek = setTimeout(() => w.innerHTML = "", jenis === "suntik" ? 4200 : 3300);
}

/* kotak sorot berkedip merah = ikon ditekan, tapi aksinya belum dibutuhkan */
function tolak(){
  const e = $("sorot");
  e.style.borderColor = "#e0393e"; bunyi("tolak");
  setTimeout(() => e.style.borderColor = "#6c4bd6", 400);
}

/* ================= AKSI IKON ================= */
function aksi(i){
  if (i === 5){ bunyi("buka"); layar = "status"; render(); return; }      // timbangan
  if (sibuk){ tolak(); return; }
  switch (i){
    case 0:                                                  // garpu pisau = makan
      naik("hunger"); bunyi("makan"); efek("makan");
      urut([["makan", D.makan], ["happy", D.happy]]); break;
    case 1:                                                  // lampu = tidur
      if (s.energy >= MAKS.energy){ tolak(); return; }       // belum waktunya tidur (energy masih penuh)
      s.tidur = true; sibuk = true; bunyi("tidur"); render();
      seq = setTimeout(() => {
        s.tidur = false; s.energy = MAKS.energy;
        urut([["happy", D.happy]]);
      }, D.tidur * 1000); break;
    case 2:                                                  // kasti = main
      naik("joy");
      bunyi("main");
      urut([["main", D.main], ["happy", D.happy]]); break;
    case 3:                                                  // suntik = obat
      if (!s.sakit){ tolak(); return; }
      s.sakit = false; naik("health"); bunyi("obat"); efek("suntik");
      urut([["suntik", D.suntik], ["sembuh", D.sembuh], ["happy", D.happy]]); break;
    case 4:                                                  // bebek = mandi
      if (s.poop <= 0){ tolak(); return; }
      naik("joy"); bunyi("mandi"); efek("mandi");
      // poop tetap terlihat selama gelembung muncul, baru hilang setelah mandi selesai
      urut([["mandi", D.mandi], ["happy", D.happy, () => { s.poop = 0; }]]); break;
    case 6:                                                  // ikon ke-3 bawah = ceramah
      if (!s.ngambek){ tolak(); return; }
      s.ngambek = false; naik("joy"); bunyi("ceramah");
      urut([["ceramah", D.ceramah], ["happy", D.happy]]); break;
    case 7:                                                  // ikon ke-4 bawah (merah kalau ada yang habis)
      if (!kritis()){ tolak(); return; }
      naik("joy"); bunyi("main");
      urut([["happy", D.happy]]); break;
  }
}

/* ================= TAMPILAN ================= */
function gambarHati(){
  const w = $("hatiWadah");
  w.innerHTML = "";
  BARIS_HATI.forEach((b, r) => b.x.forEach((x, i) => {
    const berkas = i < s[b.k] ? "hatifull.png" : "hatikosong.png";
    const [x0, y0, x1, y1] = HATI_HD[berkas][r][i];
    const bw = x1 - x0, bh = y1 - y0;
    const sk = Math.min(HATI_W / bw, HATI_H / bh);          // skala HD -> ukuran game
    const ox = (HATI_W - bw * sk) / 2, oy = (HATI_H - bh * sk) / 2;
    const d = document.createElement("div");
    d.className = "hati";
    d.style.cssText = `left:${x}px; top:${b.y}px; background-image:url(${U(berkas)});` +
      `background-size:${1109 * sk}px ${1418 * sk}px; background-position:${ox - x0 * sk}px ${oy - y0 * sk}px;`;
    w.appendChild(d);
  }));
}

// poop = layer sendiri (poop.png), bisa menumpuk sampai MAKS_POOP
// titik tengah-bawah poop di poop.png (hasil ukur) dan skala supaya tampil sebesar semula
const POOP_ASAL = { x: POOP_HD.x, y: POOP_HD.y, skala: PIKSEL / POOP_HD.P };
// titik tengah-bawah tiap poop di layar: rapat di samping karakter (kanan, kiri, lalu sebelah poop pertama)
const POOP_TUJUAN = [[650, 756], [486, 756], [688, 756]];
function gambarPoop(){
  const w = $("poopWadah");
  if (w.childElementCount === s.poop) return;
  w.innerHTML = "";
  for (let i = 0; i < s.poop; i++){
    const d = document.createElement("div");
    d.className = "poop";
    d.style.left = (POOP_TUJUAN[i][0] - POOP_ASAL.x) + "px";
    d.style.top  = (POOP_TUJUAN[i][1] - POOP_ASAL.y) + "px";
    d.innerHTML = `<img class="layer" src="${U('poop.png')}" alt="" style="transform-origin:${POOP_ASAL.x}px ${POOP_ASAL.y}px; transform:scale(${POOP_ASAL.skala})">`;
    w.appendChild(d);
  }
}

// skala gambar HD ke ukuran game, kaki di titik LANTAI (ditahan supaya tidak menabrak baris ikon)
function pasangSprite(berkas){
  const d = SPRITE[berkas], el = $("kimg");
  if (!d){ el.style.transform = "none"; return; }
  const k = d.lebar ? d.lebar / (d.b[2] - d.b[0]) : TINGGI / (d.b[3] - d.b[1]);
  const ax = (d.b[0] + d.b[2]) / 2, ay = d.b[3];
  const tinggi = (d.b[3] - d.b[1]) * k;
  const ty = Math.min(AREA_Y[1], Math.max(LANTAI.y, AREA_Y[0] + tinggi));
  el.style.transform = `translate(${LANTAI.x}px, ${ty}px) scale(${k}) translate(${-ax}px, ${-ay}px)`;
}

function render(){
  $("gelap").classList.toggle("aktif", s.tidur);
  const status = layar === "status";
  ["ikon","sorot","karakter","poopWadah","efek"].forEach(id => $(id).style.display = status ? "none" : "block");
  $("timbangan").style.display = $("hatiWadah").style.display = status ? "block" : "none";
  zonaIkon.forEach(z => z.style.display = status ? "none" : "block");
  if (RES["timbangan.png"]) $("timbangan").src = RES["timbangan.png"];
  $("timbangan").style.transform = `translate(${TIMB.x}px, ${TIMB.y}px) scale(${TIMB.s})`;
  if (status){ gambarHati(); return; }

  const fIkon = kritis() ? "iconbawahmerah.png" : "icon.png";   // ikon ke-4 bawah merah
  $("ikon").src = U(fIkon);
  pasangIkon(fIkon);
  gambarPoop();
  const pose = poseSekarang();
  $("karakter").className = "layer pose-" + pose;   // memilih animasi CSS (di pembungkus)
  $("kimg").src = U(POSE[pose]);
  pasangSprite(POSE[pose]);
  const cx = IKON_X[kursor % 4], cy = IKON_Y[kursor < 4 ? 0 : 1];
  $("sorot").style.left = (cx - 32) + "px";
  $("sorot").style.top  = (cy - 30) + "px";
}

/* ================= WAKTU ================= */
// kejadian (poop, sakit, ngambek) muncul bergantian, tidak beruntun, dan tidak yang itu-itu terus
const KEJADIAN = {
  poop:    { tiap: D.poop,    bisa: () => s.poop < MAKS_POOP, muncul: () => { s.poop++; bunyi("alert"); } },
  sakit:   { tiap: D.sakit,   bisa: () => !s.sakit,           muncul: () => { s.sakit = true; turun("health"); bunyi("sakit"); } },
  ngambek: { tiap: D.ngambek, bisa: () => !s.ngambek,         muncul: () => { s.ngambek = true; bunyi("alert"); } }
};
const jadwal = { poop: D.poop, sakit: D.sakit, ngambek: D.ngambek };   // kapan jatuh tempo berikutnya (detik)
let terakhir = "", tTerakhir = -999;
function kejadian(){
  if (sibuk || s.tidur || t - tTerakhir < D.jeda) return;
  const siap = Object.keys(KEJADIAN).filter(k => t >= jadwal[k]);
  if (!siap.length) return;
  siap.sort((a, b) => (a === terakhir) - (b === terakhir) || jadwal[a] - jadwal[b]);   // utamakan yang beda dari terakhir
  const k = siap[0];
  jadwal[k] = t + KEJADIAN[k].tiap;
  if (KEJADIAN[k].bisa()){ KEJADIAN[k].muncul(); terakhir = k; tTerakhir = t; }
}

let t = 0, adaButuh = false;
setInterval(() => {
  t++;
  if (!s.tidur){
    if (t % D.lapar  === 0) turun("hunger");
    if (t % D.joy    === 0) turun("joy");
    if (t % D.energi === 0) turun("energy");
  }
  kejadian();
  const butuh = poseSekarang() === "perhatian";
  if (butuh && !adaButuh) bunyi("alert");
  adaButuh = butuh;
  render();
}, 1000);

/* ================= TOMBOL ================= */
// tombol kiri = pilihan sebelumnya, tengah = pilih, kanan = pilihan berikutnya
const sebelumnya = () => { if (layar === "status"){ layar = "utama"; render(); } else { kursor = (kursor + 7) % 8; bunyi("klik"); render(); } };
const berikutnya = () => { if (layar === "status"){ layar = "utama"; render(); } else { kursor = (kursor + 1) % 8; bunyi("klik"); render(); } };
const tengah = () => { if (layar === "status"){ layar = "utama"; render(); } else aksi(kursor); };
$("tb1").onclick = sebelumnya; $("tb2").onclick = tengah; $("tb3").onclick = berikutnya;
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft"  || e.key === "a") sebelumnya();
  if (e.key === "ArrowRight" || e.key === "d") berikutnya();
  if (e.key === "Enter"      || e.key === "s") tengah();
  if (e.key === "Escape" && layar === "status"){ layar = "utama"; render(); }
});

/* ikon juga bisa langsung di-klik/tap */
const zonaIkon = [];
for (let i = 0; i < 8; i++){
  const b = document.createElement("button");
  b.className = "zona";
  b.setAttribute("aria-label", "ikon " + (i + 1));
  b.style.left = (IKON_X[i % 4] - 32) + "px";
  b.style.top  = (IKON_Y[i < 4 ? 0 : 1] - 30) + "px";
  b.onclick = () => { if (layar !== "utama") return; kursor = i; render(); aksi(i); };
  $("stage").appendChild(b);
  zonaIkon.push(b);
}
$("timbangan").onclick = () => { layar = "utama"; render(); };   // klik layar timbangan = tutup

/* ================= CEK GAMBAR HILANG ================= */
// nama cadangan kalau file di folder img namanya sedikit berbeda
const CADANGAN = { tidur: ["karakter_tidur.png", "karakter tidur.png", "karakter-tidur.png"] };
const hilang = new Set();
addEventListener("error", e => {
  const el = e.target;
  if (!siap || !el || el.tagName !== "IMG") return;
  const nama = decodeURIComponent(el.src.split("/").pop());
  if (el.id === "kimg"){
    const pose = poseSekarang(), c = CADANGAN[pose];
    if (c && c.length){ POSE[pose] = c.shift(); render(); return; }   // coba nama lain
  }
  hilang.add(nama);
  $("galat").textContent = "Gambar tidak ditemukan: " + [...hilang].join(", ") +
    " — cek nama file di folder hd (huruf kecil, tanpa spasi).";
  $("galat").style.display = "block";
}, true);

/* ================= UKURAN LAYAR ================= */
const TELUR = { x:278, y:380, w:575, h:668 };   // area telur di kanvas
function atur(){
  const k = Math.min((innerWidth - 16) / TELUR.w, (innerHeight - 16) / TELUR.h, 1.15);
  $("kotak").style.width  = TELUR.w * k + "px";
  $("kotak").style.height = TELUR.h * k + "px";
  $("stage").style.transform = `translate(${-TELUR.x * k}px, ${-TELUR.y * k}px) scale(${k})`;
}
addEventListener("resize", atur);
atur();
const SEMUA = [...Object.keys(SPRITE), "poop.png", "hatifull.png", "hatikosong.png", "timbangan.png", "icon.png", "iconbawahmerah.png"];
cariGambar(SEMUA).then(() => {
  siap = true;
  const tidak = SEMUA.filter(n => !RES[n]);
  if (tidak.length){
    $("galat").textContent = "Gambar tidak ditemukan: " + tidak.join(", ") +
      " — taruh di folder hd/ (sebelah index.html), huruf kecil, tanpa spasi.";
    $("galat").style.display = "block";
  }
  render();
});
</script>
