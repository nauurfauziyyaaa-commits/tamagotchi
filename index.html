<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tamagotchi</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --w:340px;                                  /* lebar Tamagotchi */
  /* posisi layar di dalam cangkang (persen): geser kalau kurang pas */
  --kiri:22.5%; --atas:23.7%; --lebar:56.7%; --tinggi:45.9%;
}
body{ margin:0; min-height:100vh; display:grid; place-items:center; background:#eef0f6; }
#tama{ position:relative; width:var(--w); }
#cangkang{ display:block; width:100%; }

#layar{
  position:absolute; left:var(--kiri); top:var(--atas);
  width:var(--lebar); height:var(--tinggi); overflow:hidden;
}
.layer{ position:absolute; inset:0; width:100%; height:100%; image-rendering:pixelated; }
#strip-atas{ height:20%; bottom:auto; }
#strip-bawah{ top:auto; height:20%; }
#karakter{ top:20%; height:60%; object-fit:contain; }
#kotoran-layer{ top:20%; height:60%; object-fit:contain; }

/* kotak sorot ikon yang dipilih */
#sorot{
  position:absolute; width:25%; height:20%; box-sizing:border-box;
  border:2px solid #222; border-radius:6px; pointer-events:none;
}

/* layar status */
#status{ position:absolute; inset:0; display:none; padding:6%; box-sizing:border-box;
  font-family:'Press Start 2P',monospace; font-size:calc(var(--w) * .03); color:#111; }
.judul,.pill{ background:#fff; border-radius:999px; box-shadow:2px 2px 0 #d9c3e6; }
.judul{ background:#fdf0fb; padding:5% 6%; margin-bottom:5%; font-size:calc(var(--w) * .034); }
.pill{ display:flex; align-items:center; gap:6px; width:68%; margin:0 0 4% 14%; padding:3% 5%; }
.hati{ display:flex; gap:3px; margin-left:auto; }
.hati img,.hati span{ width:calc(var(--w) * .035); height:calc(var(--w) * .035);
  image-rendering:pixelated; font-size:calc(var(--w) * .035); line-height:1; }

.hati .kosong{ filter:grayscale(1) brightness(1.8); opacity:.45; }

/* tombol di cangkang (transparan, menimpa tombol biru) */
.tb{ position:absolute; width:12%; aspect-ratio:1; border-radius:50%;
  transform:translate(-50%,-50%); cursor:pointer; border:0; background:transparent; }
#tb1{ left:27%; top:77.7%; } #tb2{ left:50%; top:80%; } #tb3{ left:73%; top:77.7%; }
.tb:active{ background:rgba(0,0,0,.15); }
</style>
</head>
<body>

<div id="tama">
  <img id="cangkang" src="img/cangkang.png" alt="">

  <div id="layar">
    <img class="layer" src="img/swirl.png" alt="">
    <img id="strip-atas"  class="layer" src="img/ikon-atas.png"  alt="">
    <img id="strip-bawah" class="layer" src="img/ikon-bawah.png" alt="">
    <div id="sorot"></div>
    <img id="karakter" class="layer" src="img/normal.png" alt="">
    <div id="status"></div>
  </div>

  <button class="tb" id="tb1" aria-label="Pindah pilihan"></button>
  <button class="tb" id="tb2" aria-label="Pilih"></button>
  <button class="tb" id="tb3" aria-label="Kembali"></button>
</div>

<script>
/* ---------- 1. PENGATURAN GAMBAR ---------- */
const IMG = "img/";
// kiri = nama pose di game, kanan = nama file PNG kamu (ganti kalau beda)
const SPRITE = {
  normal:"normal.png",     senang:"senang.png",     sakit:"sakit.png",
  main:"main.png",         ceramah1:"ceramah1.png", ceramah2:"ceramah2.png",
  makan:"makan.png",       kotoran:"kotoran.png",   dielus:"dielus.png",
  tidur:"tidur.png"
};

/* ---------- 2. DATA GAME ---------- */
const MAKS = 4;                 // jumlah hati
const TICK_MS = 10000;          // 1 "detik game" = 10 detik asli (kecilkan buat tes)
const AKSI = ["makan","lampu","main","obat","mandi","status","ceramah","perhatian"];

let g = {
  umur:0, berat:5, disiplin:2, ticks:0,
  hunger:3, joy:3, energy:4, health:4,
  kotoran:false, tidur:false, perhatian:false
};
try { Object.assign(g, JSON.parse(localStorage.getItem("tama") || "{}")); } catch(e){}

let kursor = 0;           // ikon yang sedang dipilih (0-7)
let layar = "utama";      // "utama" atau "status"
let halaman = 0;          // halaman layar status
let sementaraPose = null; // pose yang tampil sebentar (makan, main, dll)
let timer;

const $ = id => document.getElementById(id);
const batas = (n, a=0, b=MAKS) => Math.max(a, Math.min(b, n));

/* ---------- 3. TAMPILAN ---------- */
function poseSekarang(){
  if (sementaraPose) return sementaraPose;
  if (g.tidur) return "tidur";
  if (g.kotoran) return "kotoran";
  if (g.health <= 1 || g.hunger === 0) return "sakit";
  return "normal";
}

function hati(nilai){
  const wadah = document.createElement("div");
  wadah.className = "hati";
  for (let i = 0; i < MAKS; i++){
    const penuh = i < nilai;
    const img = document.createElement("img");
    img.src = IMG + (penuh ? "hati-penuh.png" : "hati-kosong.png");
    img.onerror = () => {                       // kalau gambar belum ada, pakai teks
      const s = document.createElement("span");
      s.textContent = penuh ? "♥" : "♡";
      img.replaceWith(s);
    };
    wadah.appendChild(img);
  }
  return wadah;
}

function pill(label, isi, kelas="pill"){
  const d = document.createElement("div");
  d.className = kelas;
  d.append(label);
  if (isi !== undefined) d.append(isi);
  return d;
}

function gambarStatus(){
  const el = $("status");
  el.innerHTML = "";
  if (halaman === 0){
    el.append(pill("hi, i'm tama!", undefined, "judul"));
    el.append(pill("hunger:", hati(g.hunger)));
    el.append(pill("joy:",    hati(g.joy)));
    el.append(pill("energy:", hati(g.energy)));
    el.append(pill("health:", hati(g.health)));
  } else {
    el.append(pill("my stats", undefined, "judul"));
    el.append(pill("age: " + g.umur));
    el.append(pill("weight: " + g.berat + "g"));
    el.append(pill("discipline:", hati(g.disiplin)));
  }
}

function render(){
  const diStatus = layar === "status";
  $("status").style.display = diStatus ? "block" : "none";
  ["strip-atas","strip-bawah","karakter","sorot"].forEach(id =>
    $(id).style.display = diStatus ? "none" : "block");
  if (diStatus){ gambarStatus(); return; }

  $("karakter").src = IMG + SPRITE[poseSekarang()];
  $("strip-bawah").src = IMG + (g.perhatian ? "ikon-bawah-perhatian.png" : "ikon-bawah.png");

  // kotak sorot: baris atas (0-3) atau bawah (4-7)
  const s = $("sorot").style;
  s.left = (kursor % 4) * 25 + "%";
  s.top  = kursor < 4 ? "0%" : "80%";
  save();
}

function save(){ try { localStorage.setItem("tama", JSON.stringify(g)); } catch(e){} }

/* ---------- 4. AKSI ---------- */
function tampilSebentar(pose, ms = 2000, lanjut){
  sementaraPose = pose; render();
  clearTimeout(timer);
  timer = setTimeout(() => {
    sementaraPose = null;
    lanjut ? lanjut() : render();
  }, ms);
}

function jalankan(nama){
  if (g.tidur && nama !== "lampu") return;      // lagi tidur: cuma lampu yang bisa
  switch (nama){
    case "makan":
      g.hunger = batas(g.hunger + 1); g.berat++;
      tampilSebentar("makan"); break;
    case "lampu":
      g.tidur = !g.tidur; render(); break;
    case "main":
      if (g.energy === 0) return;
      g.joy = batas(g.joy + 1); g.energy = batas(g.energy - 1); g.berat = Math.max(1, g.berat - 1);
      tampilSebentar("main"); break;
    case "obat":
      g.health = batas(g.health + 1);
      tampilSebentar("senang"); break;
    case "mandi":
      g.kotoran = false; g.joy = batas(g.joy + 1);
      tampilSebentar("senang"); break;
    case "status":
      layar = "status"; halaman = 0; render(); break;
    case "ceramah":
      g.disiplin = batas(g.disiplin + 1); g.joy = batas(g.joy - 1);
      tampilSebentar("ceramah1", 1200, () => tampilSebentar("ceramah2", 1200)); break;
    case "perhatian":
      if (!g.perhatian) return;
      g.perhatian = false; g.joy = batas(g.joy + 1);
      tampilSebentar("dielus"); break;
  }
}

/* ---------- 5. WAKTU BERJALAN ---------- */
function tick(){
  g.ticks++;
  if (g.ticks % 3 === 0) g.hunger = batas(g.hunger - 1);
  if (g.ticks % 4 === 0) g.joy    = batas(g.joy - 1);
  if (g.tidur) g.energy = batas(g.energy + 1);
  else if (g.ticks % 5 === 0) g.energy = batas(g.energy - 1);
  if (g.hunger === 0 && g.ticks % 3 === 0) g.health = batas(g.health - 1);
  if (!g.kotoran && Math.random() < 0.1) g.kotoran = true;
  if (!g.perhatian && !g.tidur && Math.random() < 0.1) g.perhatian = true;
  if (g.ticks % 30 === 0) g.umur++;             // 30 tick = 1 hari game
  render();
}
setInterval(tick, TICK_MS);

/* ---------- 6. TOMBOL ---------- */
function kiri(){
  if (layar === "status"){ halaman = (halaman + 1) % 2; render(); }
  else { kursor = (kursor + 1) % 8; render(); }
}
function tengah(){
  if (layar === "status"){ halaman = (halaman + 1) % 2; render(); }
  else jalankan(AKSI[kursor]);
}
function kanan(){
  if (layar === "status"){ layar = "utama"; render(); }
}

$("tb1").onclick = kiri;
$("tb2").onclick = tengah;
$("tb3").onclick = kanan;
document.addEventListener("keydown", e => {     // keyboard untuk tes di laptop
  if (e.key === "ArrowRight" || e.key === "a") kiri();
  if (e.key === "Enter" || e.key === "s") tengah();
  if (e.key === "Escape" || e.key === "d") kanan();
});

render();
</script>
</body>
</html>
